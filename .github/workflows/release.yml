# Compila os binários da Miku Lang e publica numa Release do GitHub.
# Para lançar uma versão:   git tag v0.3.0 && git push origin v0.3.0
# Também dá para rodar à mão em: Actions → Release → Run workflow (só compila e guarda os arquivos).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Testes
        run: |
          go vet ./...
          go test -race ./...

      - name: Compilar binários
        run: ./build.sh

      - name: Checksums
        working-directory: dist
        run: sha256sum miku-* > SHA256SUMS.txt

      - name: Guardar arquivos (execução manual)
        uses: actions/upload-artifact@v4
        with:
          name: miku-binarios
          path: dist/*

      - name: Publicar Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "Miku Lang ${GITHUB_REF_NAME}" \
            --generate-notes
